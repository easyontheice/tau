name: Release Obsidian Plugin

on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
      - "*" # Trigger on any tag push

permissions:
  contents: write     # create the GitHub release and upload assets
  id-token: write     # sign the build provenance attestation
  attestations: write # store the attestation on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Obsidian installs the release whose tag matches manifest.json "version",
      # so stop early if they disagree instead of publishing a broken release.
      - name: Check tag matches manifest version
        shell: bash
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$MANIFEST_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      # Release description, first match wins:
      #   1. release-notes/<tag>.md committed in the repo
      #   2. the message of an annotated tag (git tag -a 1.0.7 -m "...")
      #   3. nothing; GitHub's auto-generated notes are used on their own
      # GitHub's auto-generated "What's changed" list is appended in every case.
      - name: Prepare release notes
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ -f "release-notes/$TAG.md" ]; then
            echo "Using release-notes/$TAG.md"
            cp "release-notes/$TAG.md" release-body.md
          else
            # actions/checkout stores tags as lightweight; fetch the real tag object to read its message
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            if [ "$(git cat-file -t "$TAG")" = "tag" ]; then
              echo "Using annotated tag message"
              git tag -l --format='%(contents)' "$TAG" > release-body.md
            else
              echo "No notes file or tag message; using auto-generated notes only"
              : > release-body.md
            fi
          fi

      # Lets users verify that the release files were built from this repository
      # (gh attestation verify main.js --repo <owner>/<repo>)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          generate_release_notes: true
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
